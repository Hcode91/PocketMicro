name: Android APK

on:
  push:
    branches: [main, master, feature/generic-service-fix]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Test APK compatibility inspection
        run: bash scripts/test-compatibility.sh
      - name: Test low-address helper planner
        run: cc -O2 -Wall -Werror -Ilowaddr tests/lowaddr/test_lowaddr.c lowaddr/pocketouya_lowaddr.c -o /tmp/test_lowaddr && /tmp/test_lowaddr
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.12'
      - name: Test compatibility profiles and read-only detector
        run: gradle :app:testPurchaseProfile :app:testStructuralDetector --no-daemon
      - name: Check Android Java and bridge packaging
        run: gradle :app:compileDebugJavaWithJavac --no-daemon
      - name: Build engine host tools (milestone checks)
        run: |
          sudo apt-get install -y ninja-build zlib1g-dev >/dev/null
          cmake -S engine -B engine-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build engine-build --target so_inspect yoyo_boot


      - name: Use the release signing key if set
        env:
          KEYSTORE_B64: ${{ secrets.POCKETOUYA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "POCKETOUYA_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::POCKETOUYA_KEYSTORE_B64 is not set; this APK is signed with the public test key"
          fi

      - name: Build APK
        env:
          POCKETOUYA_KEYSTORE_PASSWORD: ${{ secrets.POCKETOUYA_KEYSTORE_PASSWORD }}
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error:|e: |FAILURE|What went wrong" -A3 build.log | tail -n 60 \
              | python3 -c "import sys;d=sys.stdin.read()[-6000:];print('::error title=build errors::'+d.replace('%','%25').replace('\n','%0A'))"
          fi
          exit $rc

      - name: Test per-phone game signing
        run: gradle :app:testApkSigning -PsigningTestApk=app/build/outputs/apk/debug/app-debug.apk --no-daemon

      - name: Name APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/PocketOuya-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PocketOuya-apk
          path: out/*.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/*.apk \
            --title "PocketOuya build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build from ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"

  # Windows Phone edition: PocketOuya with the WPR runtime built in (see winphone/README.md).
  # Same run number as the APK job, so either APK installs over the other.
  winphone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out WPR (pinned)
        run: git submodule update --init --depth 1 winphone/wpr
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.12'
      - name: Build PocketOuya as a library
        run: gradle :app:collectWinPhoneLibraries -PpocketouyaLibrary --no-daemon
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: winphone/wpr/global.json
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Ensure Android SDK platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null'
      - name: Prepare WPR as PocketOuya
        run: python3 winphone/prepare-wpr.py winphone/wpr "$GITHUB_WORKSPACE" build/winphone-libs
      # D8 stops at the first class it finds twice, so find every Java class PocketOuya's
      # libraries share with WPR's NuGet packages and remove PocketOuya's copy up front.
      - name: Remove duplicate Java classes
        run: |
          dotnet restore winphone/wpr/Src/Platforms/WPR.Platform.Android/WPR.Platform.Android.csproj \
            -p:SolutionDir="$GITHUB_WORKSPACE/winphone/wpr/Src/" -p:IncludeAndroidTargets=true --nologo
          python3 winphone/dedupe-wp-libs.py \
            winphone/wpr/Src/Platforms/WPR.Platform.Android/obj/project.assets.json \
            winphone/wpr build/winphone-libs
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.POCKETOUYA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POCKETOUYA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            { echo "SIGN_STORE=$RUNNER_TEMP/release.p12"; echo "SIGN_ALIAS=pocketouya"; echo "SIGN_PASS=$KEYSTORE_PASSWORD"; } >> "$GITHUB_ENV"
          else
            echo "::warning::POCKETOUYA_KEYSTORE_B64 is not set; signing with the public test key"
            { echo "SIGN_STORE=$GITHUB_WORKSPACE/app/ci.keystore"; echo "SIGN_ALIAS=app"; echo "SIGN_PASS=android"; } >> "$GITHUB_ENV"
          fi
      - name: Build the Windows Phone edition
        run: |
          set +e
          dotnet build winphone/wpr/Src/Platforms/WPR.Platform.Android/WPR.Platform.Android.csproj \
            -c Release -f net10.0-android36.0 -t:SignAndroidPackage \
            -p:SolutionDir="$GITHUB_WORKSPACE/winphone/wpr/Src/" \
            -p:IncludeAndroidTargets=true -p:EmbedAssembliesIntoApk=true \
            -p:ApplicationVersion="$GITHUB_RUN_NUMBER" -p:ApplicationDisplayVersion="0.1.$GITHUB_RUN_NUMBER-wp" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$SIGN_STORE" -p:AndroidSigningKeyAlias="$SIGN_ALIAS" \
            -p:AndroidSigningStorePass="$SIGN_PASS" -p:AndroidSigningKeyPass="$SIGN_PASS" \
            -maxcpucount:1 -nodeReuse:false --nologo 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error|What went wrong" build.log | sort -u | tail -n 40 \
              | python3 -c "import sys;d=sys.stdin.read()[-6000:];print('::error title=build errors::'+d.replace('%','%25').replace('\n','%0A'))"
          fi
          exit $rc
      - name: Name APK
        run: |
          mkdir -p out
          APK=$(ls winphone/wpr/Src/Platforms/WPR.Platform.Android/bin/Release/net10.0-android36.0/*-Signed.apk | head -1)
          cp "$APK" "out/PocketOuya-WindowsPhone-${GITHUB_RUN_NUMBER}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PocketOuya-WindowsPhone-apk
          path: out/*.apk
