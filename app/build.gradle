// -PpocketouyaLibrary builds PocketOuya as an Android library (.aar) for the Windows Phone
// edition, whose APK is assembled by WPR's .NET build (see winphone/README.md).
def asLibrary = project.hasProperty('pocketouyaLibrary')
apply plugin: asLibrary ? 'com.android.library' : 'com.android.application'

android {
    namespace 'com.hcode91.pocketmicro'
    compileSdk 35

    defaultConfig {
        minSdk 29
        if (!asLibrary) {
            applicationId 'com.hcode91.pocketmicro'
            targetSdk 35
            versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
            versionName "0.1." + (System.getenv('GITHUB_RUN_NUMBER') ?: 'dev')
        }
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                targets 'pocketouya_engine'
            }
        }
    }

    // Native engine (32-bit ARM translator) – see engine/ and docs/development-log.md.
    externalNativeBuild {
        cmake {
            path file('../engine/CMakeLists.txt')
            version '3.22.1+'
        }
    }
    // Use the newest NDK installed on the build machine (its folder name is the version).
    if (System.getenv('ANDROID_NDK_LATEST_HOME')) {
        def ndkDir = new File(System.getenv('ANDROID_NDK_LATEST_HOME'))
        ndkPath ndkDir.path
        ndkVersion ndkDir.name
    }

    // Fixed key in the repo so each CI build installs over the last one.
    if (!asLibrary) signingConfigs {
        // Official builds: the private release key from CI secrets (see docs/signing.md).
        // Without it (forks, local builds) the public test key in the repo is used.
        ci {
            def releaseStore = System.getenv('POCKETOUYA_KEYSTORE')
            def releasePassword = System.getenv('POCKETOUYA_KEYSTORE_PASSWORD')
            boolean useRelease = releaseStore && releasePassword
            storeFile useRelease ? file(releaseStore) : file('ci.keystore')
            storePassword useRelease ? releasePassword : 'android'
            keyAlias useRelease ? 'pocketouya' : 'app'
            keyPassword useRelease ? releasePassword : 'android'
        }
    }

    if (!asLibrary) buildTypes {
        debug { signingConfig signingConfigs.ci }
        release { signingConfig signingConfigs.ci; minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources { excludes += ['META-INF/*'] }
    }
}

def purchaseGuavaVersion = '33.3.1-android'
dependencies {
    // Google's APK signing library (same code as the apksigner tool).
    implementation 'com.android.tools.build:apksig:8.7.3'
    implementation 'org.smali:dexlib2:2.5.2'
    // dexlib2 exposes Guava types in public signatures but declares Guava at
    // runtime scope. Our compiler also needs it when resolving overloads.
    implementation "com.google.guava:guava:${purchaseGuavaVersion}"
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// Compile our own bridge into a separate DEX resource for the optional game profile.
// Game/vendor code is never copied into this project.
def bridgeClasses = layout.buildDirectory.dir('purchase-bridge/classes')
def bridgeDex = layout.buildDirectory.dir('purchase-bridge/dex')
def bridgeRes = layout.buildDirectory.dir('generated/purchase-bridge/res')
def compileBridge = tasks.register('compilePurchaseBridge', JavaCompile) {
    source rootProject.fileTree('purchase-bridge/src') { include '**/*.java' }
    classpath = files(android.bootClasspath)
    destinationDirectory = bridgeClasses
    sourceCompatibility = '8'
    targetCompatibility = '8'
}
def dexBridge = tasks.register('dexPurchaseBridge', JavaExec) {
    dependsOn compileBridge
    classpath = files(new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/lib/d8.jar"))
    mainClass = 'com.android.tools.r8.D8'
    inputs.dir bridgeClasses
    outputs.file bridgeRes.map { it.file('raw/ouya_purchase_bridge.dex') }
    doFirst {
        def output = bridgeDex.get().asFile
        output.mkdirs()
        args = ['--release', '--min-api', '23', '--lib', android.bootClasspath[0].path,
                '--output', output.path] + fileTree(bridgeClasses.get().asFile).matching { include '**/*.class' }.files.collect { it.path }
    }
    doLast {
        copy { from new File(bridgeDex.get().asFile, 'classes.dex'); into new File(bridgeRes.get().asFile, 'raw'); rename { 'ouya_purchase_bridge.dex' } }
    }
}
android.sourceSets.main.res.srcDir bridgeRes

// Licence notices (scripts/make-notices.py), shown under Manage -> Licences. The folder holds only
// that file, so nothing else from it is packaged.
android.sourceSets.main.assets.srcDir rootProject.file('notices')
tasks.named('preBuild').configure { dependsOn dexBridge }

// Opt-in low-address helper (pocketouya.low-addresses): one small 32-bit ARM library that the
// converter adds to a game when asked. Built with the NDK's clang straight into a raw resource.
def lowAddrRes = layout.buildDirectory.dir('generated/lowaddr/res')
def buildLowAddr = tasks.register('buildLowAddressHelper', Exec) {
    def src = rootProject.file('lowaddr/pocketouya_lowaddr.c')
    inputs.files(src, rootProject.file('lowaddr/pocketouya_lowaddr.h'))
    def out = lowAddrRes.map { it.file('raw/pocketouya_lowaddr.so') }
    outputs.file out
    doFirst {
        def ndk = android.ndkDirectory
        def host = ['linux-x86_64', 'darwin-x86_64', 'windows-x86_64'].find { new File(ndk, "toolchains/llvm/prebuilt/$it/bin").isDirectory() }
        if (host == null) throw new GradleException("NDK clang not found under $ndk")
        def clang = new File(ndk, "toolchains/llvm/prebuilt/$host/bin/clang" + (host.startsWith('windows') ? '.exe' : ''))
        def target = out.get().asFile
        target.parentFile.mkdirs()
        commandLine clang.path, '--target=armv7a-linux-androideabi21', '-shared', '-fPIC', '-O2', '-Wall', '-Werror',
                '-fvisibility=hidden', '-Wl,--build-id=sha1', '-Wl,-z,noexecstack', '-s',
                '-I', rootProject.file('lowaddr').path, '-o', target.path, src.path, '-llog'
    }
}
android.sourceSets.main.res.srcDir lowAddrRes
tasks.named('preBuild').configure { dependsOn buildLowAddr }

// Cheat-menu memory helper: process_vm_readv/writev for the game's own memory (Android blocks
// /proc/self/mem). Added to a game only when "Cheat menu" is ticked, in each ARM ABI it ships.
def cheatRes = layout.buildDirectory.dir('generated/cheatmem/res')
[[name: 'v7a', target: 'armv7a-linux-androideabi21'], [name: 'arm64', target: 'aarch64-linux-android21']].each { abi ->
    def task = tasks.register("buildCheatMemoryHelper_${abi.name}", Exec) {
        def src = rootProject.file('cheatmem/pocketouya_cheatmem.c')
        inputs.file src
        def out = cheatRes.map { it.file("raw/pocketouya_cheatmem_${abi.name}.so") }
        outputs.file out
        doFirst {
            def ndk = android.ndkDirectory
            def host = ['linux-x86_64', 'darwin-x86_64', 'windows-x86_64'].find { new File(ndk, "toolchains/llvm/prebuilt/$it/bin").isDirectory() }
            if (host == null) throw new GradleException("NDK clang not found under $ndk")
            def clang = new File(ndk, "toolchains/llvm/prebuilt/$host/bin/clang" + (host.startsWith('windows') ? '.exe' : ''))
            def target = out.get().asFile
            target.parentFile.mkdirs()
            commandLine clang.path, "--target=${abi.target}", '-shared', '-fPIC', '-O2', '-Wall', '-Werror', '-fvisibility=hidden',
                    '-Wl,-soname,libpocketouya_cheatmem.so', '-Wl,--build-id=sha1', '-Wl,-z,noexecstack', '-Wl,-z,max-page-size=16384', '-s',
                    '-o', target.path, src.path
        }
    }
    tasks.named('preBuild').configure { dependsOn task }
}
android.sourceSets.main.res.srcDir cheatRes

// GPU-limit shim (ouya.gles-vertex-attribs): libpogles.so caps GL_MAX_VERTEX_ATTRIBS at the OUYA's 16
// for Scaleform's Unity plugin; everything else resolves to libGLESv2.so through its dependency.
def glesRes = layout.buildDirectory.dir('generated/glcaps/res')
def buildGles = tasks.register('buildGlesLimitShim', Exec) {
    def src = rootProject.file('glcaps/pocketouya_gles.c')
    inputs.file src
    def out = glesRes.map { it.file('raw/pocketouya_gles.so') }
    outputs.file out
    doFirst {
        def ndk = android.ndkDirectory
        def host = ['linux-x86_64', 'darwin-x86_64', 'windows-x86_64'].find { new File(ndk, "toolchains/llvm/prebuilt/$it/bin").isDirectory() }
        if (host == null) throw new GradleException("NDK clang not found under $ndk")
        def clang = new File(ndk, "toolchains/llvm/prebuilt/$host/bin/clang" + (host.startsWith('windows') ? '.exe' : ''))
        def target = out.get().asFile
        target.parentFile.mkdirs()
        commandLine clang.path, '--target=armv7a-linux-androideabi21', '-shared', '-fPIC', '-O2', '-Wall', '-Werror',
                '-fvisibility=hidden', '-Wl,-soname,libpogles.so', '-Wl,--build-id=sha1', '-Wl,-z,noexecstack', '-s',
                '-o', target.path, src.path, '-Wl,--no-as-needed', '-lGLESv2', '-ldl'
    }
}
android.sourceSets.main.res.srcDir glesRes
tasks.named('preBuild').configure { dependsOn buildGles }

