// Per-phone game signing (ApkSigning) checked with apksig's own verifier on the host JVM.
// Needs any APK: gradle :app:testApkSigning -PsigningTestApk=path/to.apk
configurations { signingHostTests }
dependencies { signingHostTests 'com.android.tools.build:apksig:8.7.3' }
def signingTestClasses = layout.buildDirectory.dir('signing-tests/classes')
def compileSigningTests = tasks.register('compileApkSigningTest', JavaCompile) {
    source files('src/main/java/com/hcode91/pocketmicro/ApkSigning.java',
                 rootProject.file('tests/ApkSigningTest.java'))
    classpath = configurations.signingHostTests
    destinationDirectory = signingTestClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.register('testApkSigning', JavaExec) {
    dependsOn compileSigningTests
    classpath = files(signingTestClasses) + configurations.signingHostTests
    mainClass = 'com.hcode91.pocketmicro.ApkSigningTest'
    doFirst {
        if (!project.hasProperty('signingTestApk')) throw new GradleException('Supply -PsigningTestApk=any.apk')
        // JavaExec runs in app/, so a relative path (CI passes app/build/outputs/...) is taken from
        // the root project, where it was written; an absolute path is kept as it is.
        args rootProject.file(project.property('signingTestApk')).path, file('src/main/assets/games.p12').path
    }
}

// Windows Phone edition: PocketOuya's library plus every runtime dependency (.aar/.jar), in one
// folder for winphone/prepare-wpr.py to hand to the .NET build.
if (asLibrary) {
    tasks.register('collectWinPhoneLibraries', Copy) {
        dependsOn 'assembleRelease'
        from(layout.buildDirectory.file('outputs/aar/app-release.aar')) { rename { 'pocketouya.aar' } }
        from(configurations.named('releaseRuntimeClasspath'))
        into rootProject.layout.buildDirectory.dir('winphone-libs')
        // Empty placeholder artifact Guava uses to avoid a conflict; nothing to ship.
        exclude '**/listenablefuture-9999.0-empty-to-avoid-conflict-with-guava.jar'
        // androidx.annotation already comes from WPR's NuGet packages (Xamarin.AndroidX.Annotation.Jvm);
        // a second copy makes D8 fail with "Type androidx.annotation.AnimRes is defined multiple times".
        exclude '**/annotation-1.*.jar'
        // Compile-time annotation jars pulled in by Guava. They are not needed at run time (ART skips
        // annotations whose classes are missing) and the .NET side may already ship some of them.
        exclude '**/error_prone_annotations-*.jar', '**/j2objc-annotations-*.jar',
                '**/checker-qual-*.jar', '**/jsr305-*.jar'
        doLast {
            // WPR's NuGet packages bring Xamarin.Google.Guava.ListenableFuture, which holds the same
            // single interface Guava ships (com.google.common.util.concurrent.ListenableFuture), so
            // D8 sees it twice. Keep the NuGet copy and strip ours out of the Guava jar.
            destinationDir.listFiles().findAll { it.name ==~ /guava-.*\.jar/ }.each { jar ->
                def stripped = new File(temporaryDir, jar.name)
                stripped.delete()
                ant.zip(destfile: stripped) {
                    zipfileset(src: jar) { exclude(name: 'com/google/common/util/concurrent/ListenableFuture.class') }
                }
                ant.move(file: stripped, tofile: jar, overwrite: true)
                println "Removed ListenableFuture from ${jar.name}"
            }
            println "Windows Phone edition libraries: " + destinationDir.list().sort().join(', ')
        }
    }
}
